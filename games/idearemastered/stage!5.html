<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Idea</title>
        <div id="char"></div>
        <div id="message">Hidden Stage 5. Zombie</div>
        <a href="stage!5.html" id="restart">Try again</div>
        <a href="mainpage.html" id="exit">Exit</div>
    </head>
    <body>
        <style>
            *{
                box-sizing: border-box;
                overflow: hidden;
            }
            body{
                background-color: orangered;
            }
            #char{
                width: 80px;
                height: 80px;
                border: 5px solid deepskyblue;
                background-color: lightskyblue;
                position: absolute;
                left: 300px;
                top: 444px;
            }
            #message{
                color: white;
                font-size: 5rem;
                text-align: center;
                user-select: none;
            }
            a{
                font-size: 30px;
                border: none;
                text-decoration: none;
                display: none;
                position: absolute;
                top: 95%;
            }
            #restart{
                color: white;
                background-color: rgb(125, 0, 125);
                left: 90%;
            }
            #nextstage{
                color: rgb(0, 0, 0);
                background-color: rgb(255, 122, 0);
                left: 88%;
            }
            #exit{
                color: rgb(0, 0, 0);
                background-color: rgb(0, 255, 0);
                left: 97%;
            }
        </style>
        <script>
            var y = 444, life = 1, time = 0, oy = [], d = 0;
            window.addEventListener("keydown", function(){move(event);});
            function convert(x){ return Number(x.slice(0, x.length - 2));}
            function message(str){ document.getElementById("message").innerHTML = str;}
            function move(){
                if(event.key == "ArrowUp"){y -= 60;}
                else if(event.key == "ArrowDown"){y += 60;}
                else if(event.which == 32){shoot();}
                if(y < 0){y = 0;} else if(y > 888){y = 888;}
                document.getElementById("char").style.top = y + "px";
            }
            function make_obstacle(){
                var obs = document.createElement("DIV");
                document.body.appendChild(obs);
                obs.style.width = 80 + "px";
                obs.style.height = 80 + "px";
                obs.style.backgroundColor = "darkgray";
                obs.style.border = "5px solid gray";
                obs.style.position = "absolute";
                obs.style.left = "2000px";
                obs.style.top = 888*Math.random() + "px";
                var obs_move = setInterval(function(){
                    obs.style.left = convert(obs.style.left) - 10 + "px";
                    oy[convert(obs.style.left)/10 + 8] = convert(obs.style.top);
                    if(Math.abs(convert(obs.style.left) - 300) <= 80 && Math.abs(convert(obs.style.top) - y) <= 80 && life == 1){
                        life--; gameover("lose"); clearInterval(obs_move);
                    }
                    if(convert(obs.style.left)/10 + 8 == d){
                        d = 0;
                        obs.style.backgroundColor = "tomato";
                        obs.style.border = "5px solid red";
                        setTimeout(function(){ obs.remove();}, 1000);
                        clearInterval(obs_move);
                    }
                    if(convert(obs.style.left) <= -80){
                        if(life == 1){life--; gameover("lose"); obs.remove();} clearInterval(obs_move);
                    }
                }, 40);
            }
            function finish(){
                var obs = document.createElement("DIV");
                document.body.appendChild(obs);
                obs.style.width = 5 + "px";
                obs.style.height = 100 + "%";
                obs.style.backgroundColor = "white";
                obs.style.position = "absolute";
                obs.style.left = "2000px";
                obs.style.top = "0px";
                var obs_move = setInterval(function(){
                    obs.style.left = convert(obs.style.left) - 10 + "px";
                    if(obs.style.left == "380px" && life == 1){
                        clearInterval(game);
                        gameover("win"); clearInterval(obs_move);
                    }
                }, 25);
            }
            function shoot(){
                var obs = document.createElement("DIV");
                document.body.appendChild(obs);
                obs.style.width = 10 + "px";
                obs.style.height = 10 + "px";
                obs.style.backgroundColor = "dimgray";
                obs.style.position = "absolute";
                obs.style.left = "360px";
                obs.style.top = y + 35 + "px";
                var obs_move = setInterval(function(){
                    obs.style.left = convert(obs.style.left) + 10 + "px";
                    for(var i=0; i<208; i++){
                        if(Math.abs(convert(obs.style.top) - oy[i] - 35) < 45 && Math.abs(convert(obs.style.left) - (i - 8)*10 - 35) < 45){
                            d = i - 2; obs.remove(); clearInterval(obs_move);
                        }
                    }
                    if(convert(obs.style.left) >= 2000){
                        obs.remove(); clearInterval(obs_move);
                    }
                }, 25);
            }
            function gameover(res){
                if(res == "lose"){
                    clearInterval(game);
                    document.getElementById("restart").style.display = "block";
                    document.getElementById("exit").style.display = "block";
                    message("Fail");
                    setTimeout(function(){message(time - 17 + "%");}, 1000);
                } else if(res == "win"){
                    document.getElementById("exit").style.display = "block";
                    message("Success!");
                }
            }
            function game_func(){
                if(time == 100){ finish();}
                if(time < 100){ make_obstacle();} time++;
            }
            var game = setInterval(function(){ game_func();}, 400);
        </script>
    </body>
</html>
