<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Idea</title>
        <div id="char1" class="char"></div>
        <div id="char2" class="char"></div>
        <div id="border"></div>
        <div id="message">Stage 9. Double</div>
        <a href="stage9.html" id="restart">Try again</div>
        <a href="stage10.html" id="nextstage">Next stage</div>
        <a href="mainpage.html" id="exit">Exit</div>
    </head>
    <body>
        <style>
            *{
                box-sizing: border-box;
                overflow: hidden;
            }
            body{
                background-color: whitesmoke;
            }
            .char{
                width: 40px;
                height: 40px;
                border: 2px solid Silver;
                background-color: LightGray;
                position: absolute;
                left: 300px;
            }
            #char1{ top: 222px;}
            #char2{ top: 706px;}
            #border{
                width: 100%;
                height: 2px;
                background-color: darkgray;
                position: absolute;
                top: 484px;
            }
            #message{
                color: black;
                font-size: 5rem;
                text-align: center;
                user-select: none;
            }
            a{
                font-size: 30px;
                border: none;
                text-decoration: none;
                display: none;
                position: absolute;
                top: 95%;
            }
            #restart{
                color: white;
                background-color: rgb(125, 0, 125);
                left: 90%;
            }
            #nextstage{
                color: rgb(0, 0, 0);
                background-color: rgb(255, 122, 0);
                left: 88%;
            }
            #exit{
                color: rgb(0, 0, 0);
                background-color: rgb(0, 255, 0);
                left: 97%;
            }
        </style>
        <script>
            var y = [222, 706], life = 1, time = 0;
            window.addEventListener("keydown", function(){move(event);});
            function convert(x){ return Number(x.slice(0, x.length - 2));}
            function message(str){ document.getElementById("message").innerHTML = str;}
            function move(){
                if(event.key == "ArrowUp"){y[0] -= 20; y[1] -= 20;}
                else if(event.key == "ArrowDown"){y[0] += 20; y[1] += 20;}
                if(y[0] < 0){y[0] = 0; y[1] = 484;} else if(y[0] > 444){y[0] = 444; y[1] = 928;}
                document.getElementById("char1").style.top = y[0] + "px";
                document.getElementById("char2").style.top = y[1] + "px";
            }
            function make_obstacle(id){
                var obs = document.createElement("DIV");
                document.body.appendChild(obs);
                obs.style.width = 40 + "px";
                obs.style.height = 40 + "px";
                obs.style.backgroundColor = "silver";
                obs.style.border = "2px solid darkgray";
                obs.style.position = "absolute";
                obs.style.left = "2000px";
                obs.style.top = 484*id + 444*Math.random() + "px";
                var obs_move = setInterval(function(){
                    obs.style.left = convert(obs.style.left) - 10 + "px";
                    if(Math.abs(convert(obs.style.left) - 300) <= 40 && Math.abs(convert(obs.style.top) - y[id]) <= 40 && life == 1){
                        life--; gameover("lose"); clearInterval(obs_move);
                    }
                    if(convert(obs.style.left) <= -40){
                        obs.remove(); clearInterval(obs_move);
                    }
                }, 25);
            }
            function finish(){
                var obs = document.createElement("DIV");
                document.body.appendChild(obs);
                obs.style.width = 2 + "px";
                obs.style.height = 100 + "%";
                obs.style.backgroundColor = "darkgray";
                obs.style.position = "absolute";
                obs.style.left = "2000px";
                obs.style.top = "0px";
                var obs_move = setInterval(function(){
                    obs.style.left = convert(obs.style.left) - 10 + "px";
                    if(obs.style.left == "380px" && life == 1){
                        clearInterval(game);
                        gameover("win"); clearInterval(obs_move);
                    }
                }, 25);
            }
            function gameover(res){
                if(res == "lose"){
                    clearInterval(game);
                    document.getElementById("restart").style.display = "block";
                    document.getElementById("exit").style.display = "block";
                    message("Fail");
                    setTimeout(function(){message(time - 17 + "%");}, 1000);
                } else if(res == "win"){
                    document.getElementById("nextstage").style.display = "block";
                    document.getElementById("exit").style.display = "block";
                    message("Success!");
                }
            }
            function game_func(){
                if(time == 100){ finish();}
                if(time < 100){ make_obstacle(0); make_obstacle(1);} time++;
            }
            var game = setInterval(function(){ game_func();}, 250);
        </script>
    </body>
</html>
