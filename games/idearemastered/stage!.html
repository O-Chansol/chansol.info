<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Idea</title>
        <div id="char"></div>
        <div id="message">Hidden Stage 1. Mixed</div>
        <a href="stage!.html" id="restart">Try again</div>
        <a href="stage!1.html" id="nextstage">Next stage</div>
        <a href="mainpage.html" id="exit">Exit</div>
    </head>
    <body>
        <style>
            *{
                box-sizing: border-box;
                overflow: hidden;
            }
            body{
                background-color: powderblue;
            }
            #char{
                width: 80px;
                height: 80px;
                border: 5px solid deepskyblue;
                background-color: lightskyblue;
                position: absolute;
                left: 300px;
                top: 444px;
            }
            #message{
                color: white;
                font-size: 5rem;
                text-align: center;
                user-select: none;
            }
            a{
                font-size: 30px;
                border: none;
                text-decoration: none;
                display: none;
                position: absolute;
                top: 95%;
            }
            #restart{
                color: white;
                background-color: rgb(125, 0, 125);
                left: 90%;
            }
            #nextstage{
                color: rgb(0, 0, 0);
                background-color: rgb(255, 122, 0);
                left: 88%;
            }
            #exit{
                color: rgb(0, 0, 0);
                background-color: rgb(0, 255, 0);
                left: 97%;
            }
        </style>
        <script>
            var x = 300, y = 444, life = 1, time = 0, scene1 = 0, scene2 = 0, scene3 = 1, message_ = document.getElementById("message").innerHTML;
            var color_idx = ["deepskyblue", "dodgerblue", "limegreen", "green", "tomato", "red", "gold", "goldenrod", "magenta", "deeppink", "darkorchid", "rebeccapurple", "darkmagenta", "purple", "sienna", "saddlebrown", "silver", "darkgray", "gray", "dimgray"];
            window.addEventListener("keydown", function(){move(event);});
            function convert(x){ return Number(x.slice(0, x.length - 2));}
            function message(str){ document.getElementById("message").innerHTML = str;}
            function move(){
                if((event.key == "ArrowUp" && scene1 != 1) || (event.key == "ArrowDown" && scene1 == 1)){y -= 40;}
                else if((event.key == "ArrowDown" && scene1 != 1) || (event.key == "ArrowUp" && scene1 == 1)){y += 40;}
                if(y < 0){y = 0;} else if(y > 888 - 40*(scene1 == 4)){y = 888 - 40*(scene1 == 4);}
                document.getElementById("char").style.top = y + "px";
            }
            function move_x(){
                x += 300*(2*Math.random() - 1);
                if(x < 0){x = 0;} else if(x > 1840){x = 1840;}
                document.getElementById("char").style.left = x + "px";
            }
            function color(c1, c2, c3, c4){
                document.getElementById("message").style.color = c1;
                document.body.style.backgroundColor = c2;
                document.getElementById("char").style.backgroundColor = c3;
                document.getElementById("char").style.border = "5px solid " + c4;
            }
            function shape(id){
                if(id == "hide"){document.getElementById("char").style.visibility = "hidden";}
                else if(id == "show"){document.getElementById("char").style.visibility = "visible";}
                else if(id == "upsize"){
                    document.getElementById("char").style.width = "120px";
                    document.getElementById("char").style.height = "120px";
                }
                else if(id == "downsize"){
                    document.getElementById("char").style.width = "80px";
                    document.getElementById("char").style.height = "80px";
                }
            }
            function make_obstacle(){
                const scene = scene2;
                var obs = document.createElement("DIV");
                document.body.appendChild(obs);
                obs.style.width = 80 + "px";
                obs.style.height = 80 + "px";
                obs.style.backgroundColor = color_idx[2*scene];
                obs.style.border = "5px solid " + color_idx[2*scene + 1];
                obs.style.position = "absolute";
                obs.style.left = "2000px";
                obs.style.top = 888*Math.random() + "px";
                var obs_move = setInterval(function(){
                    var key = 20*(scene == 4);
                    obs.style.left = convert(obs.style.left) - (10 + 20*(scene == 2)*(2*Math.random() - 1) + 30*(scene == 9)) + "px";
                    if(Math.abs(convert(obs.style.left) - x - key) <= 80 + key && Math.abs(convert(obs.style.top) - y - key) <= 80 + key && life == 1){
                        life--; if(scene == 3){document.getElementById("char").style.visibility = "visible";}
                        if(scene == 5){obs.style.visibility = "visible";} gameover("lose"); clearInterval(obs_move);
                    }
                    if(scene == 7){
                        obs.style.top = convert(obs.style.top) + 20*(2*Math.random() - 1) + "px";
                        if(convert(obs.style.top) < 0){obs.style.top = 0 + "px";}
                        else if(convert(obs.style.top) > 888){obs.style.top = 888 + "px";}
                    }
                    if(scene == 5 && convert(obs.style.left) == 900){ obs.style.visibility = "hidden";}
                    if(scene == 5 && convert(obs.style.left) == 200){ obs.style.visibility = "visible";}
                    if(convert(obs.style.left) <= -80){
                        obs.remove(); clearInterval(obs_move);
                    }
                }, 25);
            }
            function finish(){
                var obs = document.createElement("DIV");
                document.body.appendChild(obs);
                obs.style.width = 5 + "px";
                obs.style.height = 100 + "%";
                obs.style.backgroundColor = "dimgray";
                obs.style.position = "absolute";
                obs.style.left = "2000px";
                obs.style.top = "0px";
                var obs_move = setInterval(function(){
                    obs.style.left = convert(obs.style.left) - 40 + "px";
                    if(obs.style.left == "360px" && life == 1){
                        scene3 = 0; gameover("win"); clearInterval(obs_move);
                    }
                }, 25);
            }
            function gameover(res){
                if(res == "lose"){
                    clearInterval(game1);
                    document.getElementById("restart").style.display = "block";
                    document.getElementById("exit").style.display = "block";
                    message("Fail");
                    setTimeout(function(){message(Math.round((time - 17)/3) + "%");}, 1000);
                } else if(res == "win"){
                    document.getElementById("nextstage").style.display = "block";
                    document.getElementById("exit").style.display = "block";
                    message("Success!");
                }
            }
            function game_func(){
                scene1 = Math.floor((time - 17/(1 + 3*(scene2 == 9)))/30); if(scene1 == -1) {scene1 = 0;}
                scene2 = Math.floor(time/30); if(scene2 == -1) {scene2 = 0;}
                if(scene1 == 1){
                    color("white", "palegreen", "lawngreen", "limegreen");
                } else if(scene1 == 2){
                    color("white", "lightsalmon", "salmon", "tomato");
                } else if(scene1 == 3){
                    color("black", "lightyellow", "yellow", "gold");
                    shape("hide");
                } else if(scene1 == 4){
                    color("white", "pink", "hotpink", "magenta");
                    shape("show");
                    shape("upsize");
                } else if(scene1 == 5){
                    color("white", "thistle", "plum", "darkorchid");
                    shape("downsize");
                } else if(scene1 == 6){
                    color("white", "plum", "orchid", "darkmagenta");
                } else if(scene1 == 7){
                    color("white", "gold", "goldenrod", "sienna");
                } else if(scene1 == 8){
                    color("black", "whitesmoke", "lightgray", "silver");
                } else if(scene1 == 9){
                    color("white", "silver", "darkgray", "gray");
                    if(!scene3){scene_8(); scene3 = 1;}
                }
                if(time == 300){ finish();}
                if(time < 300){ make_obstacle();} time += (4 - 3*(scene1 == 8))/4;
                if(scene1 == 6){move_x();}
                if(scene1 == 8 && scene3 == 1){scene3 = 0; x = 300; document.getElementById("char").style.left = 300 + "px";}
            }
            var game1 = setInterval(function(){ game_func();}, 250);
            function scene_8(){
                clearInterval(game1);
                var game2 = setInterval(function(){ game_func(); if(!scene3){clearInterval(game2);}}, 250/4);
            }
        </script>
    </body>
</html>
