<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Idea</title>
        <div id="char1" class="char"></div>
        <div id="char2" class="char"></div>
        <div id="message">Item 6. Clone</div>
        <a href="item6.html" id="restart">Try again</div>
        <a href="item7.html" id="nextstage">Next stage</div>
        <a href="mainpage.html" id="exit">Exit</div>
    </head>
    <body>
        <style>
            *{
                box-sizing: border-box;
                overflow: hidden;
            }
            body{
                background-color: Thistle;
            }
            .char{
                width: 80px;
                height: 80px;
                border: 5px solid DarkOrchid;
                background-color: Plum;
                position: absolute;
                left: 300px;
            }
            #char1{ top: 202px;}
            #char2{ top: 686px;}
            #message{
                color: white;
                font-size: 5rem;
                text-align: center;
                user-select: none;
            }
            a{
                font-size: 30px;
                border: none;
                text-decoration: none;
                display: none;
                position: absolute;
                top: 95%;
            }
            #restart{
                color: white;
                background-color: rgb(125, 0, 125);
                left: 90%;
            }
            #nextstage{
                color: rgb(0, 0, 0);
                background-color: rgb(255, 122, 0);
                left: 88%;
            }
            #exit{
                color: rgb(0, 0, 0);
                background-color: rgb(0, 255, 0);
                left: 97%;
            }
        </style>
        <script>
            var y = [202, 686], life = [1, 1], time = 0;
            window.addEventListener("keydown", function(){move(event);});
            function convert(x){ return Number(x.slice(0, x.length - 2));}
            function message(str){ document.getElementById("message").innerHTML = str;}
            function move(){
                if(event.key == "ArrowUp"){y[0] -= 40; y[1] -= 40;}
                else if(event.key == "ArrowDown"){y[0] += 40; y[1] += 40;}
                if(y[0] < 0){y[0] = 0; y[1] = 484;} else if(y[1] > 888){y[0] = 404; y[1] = 888;}
                document.getElementById("char1").style.top = y[0] + "px";
                document.getElementById("char2").style.top = y[1] + "px";
            }
            function make_obstacle(){
                var obs = document.createElement("DIV");
                document.body.appendChild(obs);
                obs.style.width = 80 + "px";
                obs.style.height = 80 + "px";
                obs.style.backgroundColor = "DarkOrchid";
                obs.style.border = "5px solid RebeccaPurple";
                obs.style.position = "absolute";
                obs.style.left = "2000px";
                obs.style.top = 888*Math.random() + "px";
                var obs_move = setInterval(function(){
                    obs.style.left = convert(obs.style.left) - 10 + "px";
                    if(Math.abs(convert(obs.style.left) - 300) <= 80 && !life[0]*!life[1] != 1){
                        if(Math.abs(convert(obs.style.top) - y[0]) <= 80 && life[0]){
                            life[0]--; if(!life[1]){ gameover("lose"); clearInterval(obs_move);}
                            document.getElementsByClassName("char")[0].style.visibility = "hidden";
                            setTimeout(function(){document.getElementsByClassName("char")[0].style.visibility = "visible"; life[0]++;}, 1500);
                        } else if(Math.abs(convert(obs.style.top) - y[1]) <= 80 && life[1]){
                            life[1]--; if(!life[0]){ gameover("lose"); clearInterval(obs_move);}
                            document.getElementsByClassName("char")[1].style.visibility = "hidden";
                            setTimeout(function(){document.getElementsByClassName("char")[1].style.visibility = "visible"; life[1]++;}, 1500);
                        }
                    }
                    if(convert(obs.style.left) <= -80){
                        obs.remove(); clearInterval(obs_move);
                    }
                }, 25);
            }
            function finish(){
                var obs = document.createElement("DIV");
                document.body.appendChild(obs);
                obs.style.width = 5 + "px";
                obs.style.height = 100 + "%";
                obs.style.backgroundColor = "RebeccaPurple";
                obs.style.position = "absolute";
                obs.style.left = "2000px";
                obs.style.top = "0px";
                var obs_move = setInterval(function(){
                    obs.style.left = convert(obs.style.left) - 10 + "px";
                    if(obs.style.left == "380px" && life == 1){
                        clearInterval(game);
                        gameover("win"); clearInterval(obs_move);
                    }
                }, 25);
            }
            function gameover(res){
                if(res == "lose"){
                    clearInterval(game);
                    message("Fail");
                    setTimeout(function(){message(time - 17 + "%");}, 1000);
                } else if(res == "win"){
                    message("Success!");
                }
            }
            function game_func(){
                if(time == 100){ finish();}
                if(time < 100){ make_obstacle();} time++;
            }
            var game = setInterval(function(){ game_func();}, 250);
        </script>
    </body>
</html>
