<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Stage 5. control</title>
        <link rel="stylesheet" href="css/game.css">
        <link rel="stylesheet" href="css/stage5.css">
        <link rel="stylesheet" href="css/blocks.css">
    </head>
    <body class="game-page" data-stage="5">
        <header class="game-header">
            <a class="brand" href="mainpage.html">CODING MAN<span>REMASTERED</span></a>
            <h1 id="title">Stage 5. control</h1>
            <p class="controls-hint"><kbd>←</kbd> <kbd>→</kbd> 회전 · <kbd>↑</kbd> <kbd>↓</kbd> 이동 · <kbd>Space</kbd> 공격</p>
        </header>
        <main class="game-layout">
            <aside class="code-palette" aria-label="플레이어 코드">
                <h2 class="panel-title">내 코드 <span>KEYBOARD + MOUSE</span></h2>
                <div class="palette-groups">
                    <section class="block-group"><h3>동작</h3>
                        <button class="motion" id="random" data-action="random" data-cooldown="3000">move to random position</button>
                        <button class="motion" id="point" data-action="point" data-cooldown="3000">point towards character</button>
                        <button class="motion" id="move1" data-action="move1">move 10 steps</button>
                        <button class="motion" id="move2" data-action="move2">move -10 steps</button>
                        <button class="motion" id="bounce" data-action="bounce">if on edge, bounce</button>
                        <button class="motion" id="clock" data-action="clock">turn ⟳ 45 degrees</button>
                        <button class="motion" id="counter_clock" data-action="counter_clock">turn ⟲ 45 degrees</button>
                    </section>
                    <section class="block-group"><h3>형태</h3>
                        <button class="looks" id="size" data-action="size" data-cooldown="3000">set size to 50%</button>
                        <button class="looks" id="hide" data-action="hide" data-cooldown="3000">hide</button>
                    </section>
                    <section class="block-group"><h3>소리</h3>
                        <button class="sound" id="sound" data-action="sound" data-cooldown="3000">start sound</button>
                        <button class="sound" id="mute" data-action="mute" data-cooldown="15000">stop all sounds</button>
                    </section>
                    <section class="block-group"><h3>공격</h3>
                        <button class="myblocks" id="attack" data-action="attack">attack</button>
                    </section>
                </div>
                <p class="palette-note">블록을 클릭하거나 표시된 키를 누르세요.</p>
            </aside>
            <section class="arena-column" aria-label="플레이 영역">
                <div class="health-bars">
                    <div class="health"><div class="health-label"><span>You</span></div><div class="health-track"><div id="char_life" role="progressbar" aria-label="플레이어 체력" aria-valuemin="0" aria-valuemax="10" aria-valuenow="10"></div></div></div>
                    <div class="health"><div class="health-label"><span>Bug</span></div><div class="health-track"><div id="bug_life" role="progressbar" aria-label="버그 체력" aria-valuemin="0" aria-valuemax="10" aria-valuenow="10"></div></div></div>
                </div>
                <div id="arena" class="arena" aria-label="정사각형 전투장">
                    <div id="char" class="actor" aria-label="플레이어"><span>^</span></div>
                    <div id="bug" class="actor" aria-label="버그"><span>^</span></div>
                </div>
                <nav class="movement-controls" aria-label="이동 조작">
                    <button class="move-button" data-move="ArrowLeft" aria-label="왼쪽 회전">←</button>
                    <button class="move-button" data-move="ArrowUp" aria-label="전진">↑</button>
                    <button class="move-button" data-move="ArrowDown" aria-label="후진">↓</button>
                    <button class="move-button" data-move="ArrowRight" aria-label="오른쪽 회전">→</button>
                    <span class="movement-label">마우스 · 터치 · 방향키로 조작</span>
                </nav>
                <p id="game-status" class="game-status" role="status"></p>
                <div class="game-actions">
                    <form action="code5.html" method="GET">
                        <input type="hidden" name="stage" value="6">
                        <button type="submit" id="nextlevel">Stage 6으로 ↵</button>
                    </form>
                    <button id="restart">다시 시작 ↵</button>
                    <button id="exit">메뉴 · Esc</button>
                </div>
                <p class="shortcut-note"><kbd>Enter</kbd> 승패 후 진행 · <kbd>Esc</kbd> 메뉴</p>
            </section>
            <aside class="enemy-panel" aria-label="버그의 코드">
                <h2 id="bug_code" class="panel-title">Bug Code <span>LIVE</span></h2>
                <div id="code-log" class="code-log"><p class="empty-log">버그가 실행하는 코드를<br>여기서 확인할 수 있어요.</p></div>
            </aside>
        </main>
        <script src="js/commands.js"></script>
        <script src="js/blocks.js"></script>
        <script src="js/stages.js"></script>
        <script src="js/game.js"></script>
        <script src="js/effects.js"></script>
        <script src="js/player-commands.js"></script>
        <script src="js/program-model.js"></script>
        <script src="js/program-runtime.js"></script>
        <script src="js/program-battle.js"></script>
        <script src="js/controls.js"></script>
    </body>
</html>
